name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ledger_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with throwaway secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the API to answer
        run: |
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1
      - name: Smoke test
        run: ./scripts/smoke_test.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
