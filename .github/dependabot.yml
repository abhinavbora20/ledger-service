version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # pydantic pins an exact pydantic-core version, so the two must move together.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
